framework:
    secret: '%env(APP_SECRET)%'
    
doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # server_version: '8.0'
        
    orm:
        auto_generate_proxy_classes: true
        entity_managers:
            default:
                auto_mapping: true
                mappings:
                    App:
                        is_bundle: false
                        type: annotation
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
                        alias: App

when@test:
    doctrine:
        dbal:
            # Use SQLite for tests
            url: "sqlite:///%kernel.project_dir%/var/test.db"
